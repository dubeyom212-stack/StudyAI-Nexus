{% extends 'base.html' %}{% block content %}<p class="eyebrow">YOUR STARTING POINT</p><h1>How familiar does this feel?</h1><p class="lede">An optional confidence check. Your practice will tell us more.</p>{% include '_selectors.html' %}
<form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="subject" value="{{ subject }}">
{% for topic in catalog[subject] %}<div class="rating-row"><label for="rating_{{ loop.index0 }}">{{ topic }}</label><select id="rating_{{ loop.index0 }}" name="rating_{{ loop.index0 }}" required><option value="">Choose a level</option>{% for value,label in [(1,'New to me'),(2,'Need help'),(3,'Somewhat familiar'),(4,'Comfortable'),(5,'Can explain it')] %}<option value="{{ value }}" {% if course.ratings.get(topic) == value %}selected{% endif %}>{{ value }} · {{ label }}</option>{% endfor %}</select></div>{% endfor %}<button class="button">Save and build my plan →</button></form>{% endblock %}
