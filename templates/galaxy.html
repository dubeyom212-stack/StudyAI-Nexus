{% extends 'base.html' %}{% block content %}<p class="eyebrow">Progress</p><h1>Topic progress</h1><p class="lede">Written-practice scores and confidence ratings for each topic.</p>{% include '_selectors.html' %}<div class="topic-grid">{% for row in rows %}<article class="panel"><span class="tag {{ 'warm' if row.status == 'Needs practice' else '' }}">{{ row.status }}</span><h3>{{ row.topic }}</h3><p class="small muted">{{ row.evidence }}</p><a href="{{ url_for('practice', subject=subject, topic=row.topic) }}">Practice this topic</a></article>{% endfor %}</div>{% endblock %}
