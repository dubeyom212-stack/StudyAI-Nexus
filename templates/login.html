{% extends 'base.html' %}{% block content %}<div class="auth"><h1>Sign in</h1><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" maxlength="150" value="{{ request.form.get('email','') }}" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required><button class="button">Sign in</button></form><p>Need an account? <a href="{{ url_for('signup') }}">Create an account</a></p></div>{% endblock %}
