{% extends 'base.html' %}{% block content %}<div class="auth"><p class="eyebrow">YOUR OWN SPACE TO LEARN</p><h1>Build your study routine.</h1><p class="lede">Keep your courses, practice, and progress together.</p><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Name</label><input id="username" name="username" autocomplete="nickname" minlength="2" maxlength="100" value="{{ request.form.get('username','') }}" required><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" maxlength="150" value="{{ request.form.get('email','') }}" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required><p class="small muted">Use at least 8 characters.</p><button class="button">Create my account →</button></form><p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
